name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的标签（例如 v1.0.0-pre）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: Release acceptance (Windows x64)
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-acceptance-windows-x64
      - name: Install dependencies
        run: npm ci
      - name: Verify release identity
        shell: bash
        run: node tools/check-release.mjs --tag "$RELEASE_TAG"
      - name: Build frontend and check types
        run: npm run build
      - name: Run UI safety regressions
        run: npm run test:ui
      - name: Run Rust library and portable integration regressions
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --test backup_roundtrip --test backup_dump_streaming --test e2e_sync_diff_incremental --test e2e_sync_regressions --test transfer_sync_acceptance -- --test-threads=1

  build:
    name: Build (${{ matrix.label }})
    needs: acceptance
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: ''
            arch: x64
            bundles: nsis
          - label: windows-arm64
            os: windows-11-arm
            target: ''
            arch: arm64
            bundles: nsis
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            bundles: app
          - label: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
            bundles: app
          - label: linux-x64
            os: ubuntu-22.04
            target: ''
            arch: x64
            bundles: appimage,deb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: ${{ matrix.target != '' }}
        run: rustup target add ${{ matrix.target }}

      - name: Install macOS unixODBC and dylibbundler
        if: runner.os == 'macOS'
        run: |
          brew install unixodbc dylibbundler
          ODBC_PREFIX="$(brew --prefix unixodbc)"
          echo "CPATH=$ODBC_PREFIX/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$ODBC_PREFIX/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ODBC_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.label }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf unixodbc-dev libxdo-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        shell: bash
        run: |
          set -euo pipefail
          args=(build --config src-tauri/tauri.release.conf.json --bundles "${{ matrix.bundles }}")
          if [ -n "${{ matrix.target }}" ]; then
            args+=(--target "${{ matrix.target }}")
          fi
          args+=(-- --locked)
          npx tauri "${args[@]}"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $target = "${{ matrix.target }}"
          $rel = if ($target) { "src-tauri/target/$target/release" } else { "src-tauri/target/release" }
          New-Item -ItemType Directory -Force -Path dist-release, portable-staging | Out-Null
          $stage = "portable-staging/NavKit-$ver-windows-$env:ARCH-portable"
          New-Item -ItemType Directory -Force -Path $stage, "$stage/data" | Out-Null
          Copy-Item "$rel/navkit.exe" "$stage/NavKit.exe"
          Copy-Item "assets/使用说明.txt" "$stage/README-portable.txt"
          # 免安装包只保留运行必需的 NavKit.exe、data\ 与使用说明：不再内置 WebView2 引导程序
          # （安装包已通过 webviewInstallMode=embedBootstrapper 内嵌，Win10/11 通常也已自带运行时），避免体积膨胀。
          Compress-Archive -Path "$stage/*" -DestinationPath "dist-release/NavKit-$ver-windows-$env:ARCH-portable.zip" -Force
          Copy-Item "$rel/navkit.exe" "dist-release/NavKit-$ver-windows-$env:ARCH-portable.exe" -Force
          $setup = Get-ChildItem "$rel/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'setup' } | Select-Object -First 1
          if (-not $setup) { $setup = Get-ChildItem "$rel/bundle/nsis/*.exe" | Select-Object -First 1 }
          Copy-Item $setup.FullName "dist-release/NavKit-$ver-windows-$env:ARCH-installer.exe" -Force
          Get-ChildItem dist-release | Select-Object Name

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          REL="src-tauri/target/${{ matrix.target }}/release"
          APP="$REL/bundle/macos/NavKit.app"
          BIN="$APP/Contents/MacOS/navkit"
          [ -d "$APP" ] || { echo "app not found: $APP"; exit 1; }
          mkdir -p "$APP/Contents/Frameworks" dist-release
          dylibbundler -od -b -x "$BIN" -d "$APP/Contents/Frameworks" -p @executable_path/../Frameworks
          codesign --force --deep --sign - "$APP" || true
          echo '--- bundled dylibs ---'; ls -la "$APP/Contents/Frameworks"
          hdiutil create -volname "NavKit" -srcfolder "$APP" -ov -format UDZO "dist-release/NavKit-$ver-macos-$ARCH-installer.dmg" >/dev/null
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist-release/NavKit-$ver-macos-$ARCH-portable.zip"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/deb/*.deb "dist-release/NavKit-$ver-linux-$ARCH-installer.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "dist-release/NavKit-$ver-linux-$ARCH-portable.AppImage"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node tools/check-release.mjs --tag "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          pattern: release-*
          merge-multiple: true

      - name: Generate update manifest
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone

          ver = json.load(open("package.json", encoding="utf-8"))["version"]
          asset = f"NavKit-{ver}-windows-x64-portable.exe"
          path = os.path.join("dist-release", asset)
          if not os.path.isfile(path):
              raise SystemExit(f"缺少 Windows x64 便携版产物: {path}")

          digest = hashlib.sha256()
          with open(path, "rb") as fh:
              for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                  digest.update(chunk)

          tag = os.environ["RELEASE_TAG"]
          manifest = {
              "version": ver,
              "notes": f"NavKit {ver}",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{asset}",
              "sha256": digest.hexdigest(),
              "size": os.path.getsize(path),
          }
          out = os.path.join("dist-release", "navkit-win64.json")
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          print(f"--- {out} ---")
          print(open(out, encoding="utf-8").read())
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: NavKit ${{ steps.tag.outputs.tag }}${{ contains(inputs.tag || github.ref_name, '-') && ' 预览版' || '' }}
          body_path: .github/RELEASE_NOTES.md
          # 预发布（tag 含 '-'，如 v1.0.0-pre）标记为 prerelease；正式版则设为 latest，
          # 这样客户端固定的 .../releases/latest/download/navkit-win64.json 才会指向它。
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          make_latest: ${{ !contains(inputs.tag || github.ref_name, '-') }}
          files: dist-release/*
          fail_on_unmatched_files: false

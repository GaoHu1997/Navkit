name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的标签（例如 v1.0.0-pre）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            bundles: nsis
            target: ''
          - label: macos-native
            os: macos-latest
            bundles: app,dmg
            target: ''
          - label: linux-x64
            os: ubuntu-22.04
            bundles: appimage,deb
            target: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS ODBC (unixODBC)
        if: runner.os == 'macOS'
        run: |
          brew install unixodbc
          ODBC_PREFIX="$(brew --prefix unixodbc)"
          echo "CPATH=$ODBC_PREFIX/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$ODBC_PREFIX/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ODBC_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.label }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf unixodbc-dev libxdo-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        shell: bash
        run: |
          set -euo pipefail
          args=(build --config src-tauri/tauri.release.conf.json --bundles "${{ matrix.bundles }}")
          if [ -n "${{ matrix.target }}" ]; then
            args+=(--target "${{ matrix.target }}")
          fi
          npx tauri "${args[@]}"

      - name: Package portable and collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $portable = "dist-release/NavKit-$ver-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $portable, "$portable/data" | Out-Null
          Copy-Item src-tauri/target/release/navkit.exe "$portable/NavKit.exe"
          Copy-Item "assets/使用说明.txt" "$portable/README-portable.txt"
          Compress-Archive -Path "$portable/*" -DestinationPath "dist-release/NavKit-$ver-windows-x64-portable.zip" -Force
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist-release/ -Force

      - name: Package portable and collect artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          arch=$(uname -m)
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/dmg/*.dmg dist-release/
          APP="src-tauri/target/release/bundle/macos/NavKit.app"
          if [ ! -d "$APP" ]; then
            DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
            MNT=$(mktemp -d)
            hdiutil attach "$DMG" -nobrowse -mountpoint "$MNT" >/dev/null
            ditto -c -k --sequesterRsrc --keepParent "$MNT/NavKit.app" "dist-release/NavKit-$ver-macos-$arch-portable.zip"
            hdiutil detach "$MNT" >/dev/null
          else
            ditto -c -k --sequesterRsrc --keepParent "$APP" "dist-release/NavKit-$ver-macos-$arch-portable.zip"
          fi

      - name: Package portable and collect artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist-release/
          cp src-tauri/target/release/bundle/deb/*.deb dist-release/
          tar -czf "dist-release/NavKit-$ver-linux-x64-portable.tar.gz" -C src-tauri/target/release navkit
          cp "assets/使用说明.txt" "dist-release/README-portable.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          pattern: release-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: NavKit ${{ steps.tag.outputs.tag }} 预览版
          body_path: .github/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          files: dist-release/**
          fail_on_unmatched_files: false

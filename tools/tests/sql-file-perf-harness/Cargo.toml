[package]
name="navkit-sql-file-perf-harness"
version="0.1.0"
edition="2021"

[dependencies]
anyhow="1"
serde={version="1",features=["derive"]}
serde_json="1"
tokio={version="1",features=["full"]}
parking_lot="0.12"
sha2="0.10"
encoding_rs="0.8"
libsqlite3-sys="=0.30.1"
[dependencies.sqlx]
version="0.8"
default-features=false
features=["runtime-tokio","sqlite","mysql","postgres","tls-rustls"]

[profile.release]
opt-level=3

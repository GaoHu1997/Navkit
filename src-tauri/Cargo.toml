[package]
name = "navkit"
version = "1.0.2"
description = "NavKit 数据库管理工具"
edition = "2021"
rust-version = "1.77"

[lib]
name = "navkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "mysql",
  "postgres",
  "sqlite",
  "chrono",
  "uuid",
  "json",
  "bigdecimal",
  "tls-rustls",
] }
libsqlite3-sys = "=0.30.1"
# SQL 解析：用于查询页服务器分页的安全判断与改写。思路借鉴 dbx (Apache-2.0)。
sqlparser = "0.62"
anyhow = "1"
thiserror = "2"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "=0.10.4"
encoding_rs = "0.8"
csv = "1.3"
quick-xml = "0.37"
futures = "0.3"
parking_lot = "0.12"
odbc-api = "29.3.0"
reqwest = { version = "0.13.3", features = ["json", "form", "gzip", "stream"] }
async-trait = "0.1"
# SQL Server 原生客户端（TDS 协议）
tiberius = { version = "0.12", default-features = false, features = ["chrono", "rustls", "tds73"] }
tokio-util = { version = "0.7", features = ["net"] }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
webpki-roots = "0.26"
# Redis / MongoDB 原生客户端
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
mongodb = "3"
# Native planned-source adapters (pure Rust; no ODBC fallback).
scylla = "0.13"
rskafka = { version = "0.6", features = ["transport-tls"] }
rumqttc = "0.24"
zookeeper-client = { version = "0.11", features = ["tokio"] }
nebula-client = "0.7.3"
nebula-fbthrift-graph-v3 = "0.3"
fbthrift-transport = "0.9"
async-compat = "0.2"
hmac = "0.12"
sha1 = "0.10"
flate2 = "1"
url = "2"
sha2 = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
zeroize = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
incremental = false
